<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>馬賽克遮蔽工具（PDF／圖片）</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#e8ebee;--panel:#f6f7f8;--ink:#1b2430;--mute:#5b6676;--line:#c7cfd8;--acc:#1d4ed8;--accink:#fff;--stage:#d3d9e0;--warn:#b42318;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14181e;--panel:#1c222b;--ink:#e6eaf0;--mute:#9aa5b4;--line:#323b48;--acc:#6f95ff;--accink:#0c1220;--stage:#0f1318;--warn:#ff8a7a}}
:root[data-theme="dark"]{--bg:#14181e;--panel:#1c222b;--ink:#e6eaf0;--mute:#9aa5b4;--line:#323b48;--acc:#6f95ff;--accink:#0c1220;--stage:#0f1318;--warn:#ff8a7a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:400 15px/1.5 "Noto Sans TC",system-ui,-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;display:flex;flex-direction:column}
.bar{background:var(--panel);border-bottom:1px solid var(--line);padding:10px 16px;display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center}
h1{font-size:16px;font-weight:700;margin:0 6px 0 0}
.grp{display:flex;align-items:center;gap:8px}
.grp label{color:var(--mute);font-size:13px}
button,.btn{font:500 14px/1 inherit;font-family:inherit;color:var(--ink);background:transparent;border:1px solid var(--line);border-radius:6px;padding:8px 12px;cursor:pointer}
button:hover:not(:disabled),.btn:hover{border-color:var(--ink)}
button:disabled{opacity:.4;cursor:default}
button:focus-visible,.btn:focus-within,input:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.pri{background:var(--acc);color:var(--accink);border-color:var(--acc)}
.seg{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg label{color:var(--ink);padding:7px 12px;cursor:pointer;font-size:14px}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg input:checked+span{font-weight:700}
.seg label:has(input:checked){background:var(--acc);color:var(--accink)}
.seg label:has(input:focus-visible){outline:2px solid var(--acc);outline-offset:-2px}
#file{display:none}
input[type=text]{font:inherit;font-size:14px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:7px 8px;width:130px}
.grp label.chk{color:var(--ink);display:flex;gap:6px;align-items:center;cursor:pointer}
input[type=range]{width:110px;accent-color:var(--acc)}
.sp{flex:1}
#stage{flex:1;min-height:0;overflow:auto;background:var(--stage);display:flex;justify-content:center;align-items:flex-start;padding:16px}
#cv{display:none;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);cursor:crosshair;touch-action:none;max-width:100%}
#empty{margin:auto;text-align:center;color:var(--mute);max-width:360px}
#empty b{display:block;color:var(--ink);font-size:18px;margin-bottom:6px}
#stage.over{outline:3px dashed var(--acc);outline-offset:-8px}
.foot{background:var(--panel);border-top:1px solid var(--line);padding:8px 16px;font-size:13px;color:var(--mute);min-height:20px}
.foot.err{color:var(--warn)}
.tag{font-size:13px;color:var(--mute)}
.tag.edit{color:var(--warn);font-weight:700}
.hide{display:none!important}
</style>
</head>
<body>
<div class="bar">
  <h1>馬賽克遮蔽</h1>
  <div class="grp"><div class="seg" role="radiogroup" aria-label="工作區"><label><input type="radio" name="tab" value="pdf" checked><span>PDF</span></label><label><input type="radio" name="tab" value="tw"><span>台股快訊（JPG）</span></label><label><input type="radio" name="tab" value="img"><span>自訂圖片</span></label></div></div>
  <div class="grp pdfonly"><div class="seg" role="radiogroup" aria-label="文件類型"><label><input type="radio" name="sess" value="pre" checked><span>盤前（行動快訊）</span></label><label><input type="radio" name="sess" value="post"><span>盤後（盤後快訊）</span></label></div><span id="sinfo" class="tag"></span></div>
  <label class="btn" tabindex="0" id="pick"><span id="picktxt">選擇 PDF</span><input id="file" type="file" accept="application/pdf" multiple></label>
  <div class="grp"><div class="seg" role="radiogroup" aria-label="遮蔽方式">
    <label><input type="radio" name="mode" value="mosaic" checked><span>馬賽克</span></label>
    <label><input type="radio" name="mode" value="black"><span>黑色方塊</span></label></div></div>
  <div class="grp"><label for="size">顆粒大小</label><input id="size" type="range" min="6" max="48" value="18"></div>
  <div class="grp"><label for="lim">大小上限</label><select id="lim" style="font:inherit;font-size:14px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:7px 6px"><option value="-1">盡量最小</option><option value="0">不限</option><option value="500">500 KB</option><option value="800" selected>800 KB</option><option value="850">850 KB</option><option value="1024">1 MB</option><option value="2048">2 MB</option><option value="5120">5 MB</option></select></div>
  <div class="grp imgonly hide"><label for="ofmt">輸出格式</label><select id="ofmt" style="font:inherit;font-size:14px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:7px 6px"><option value="same" selected>同原檔</option><option value="jpg">JPG</option><option value="png">PNG</option></select></div>
  <div class="grp pdfonly"><label class="chk" title="所有頁面都轉成圖片並壓縮，包含沒有遮蔽的頁面（文字將無法選取）"><input type="checkbox" id="all">先壓縮整份文件</label></div>
  <div class="grp pdfonly"><label for="q">起始畫質</label><select id="q" style="font:inherit;font-size:14px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:7px 6px"><option value="1">小檔</option><option value="2" selected>標準</option><option value="3">高畫質</option></select></div>
  <div class="grp pdfonly"><label for="pages">套用頁數</label><input id="pages" type="text" placeholder="全部 或 1-3,5" title="留空＝只套用在目前這一頁"></div>
  <div class="grp pdfonly"><label class="chk" title="在 PDF 頁面中間加上「投顧會員網」引流圖片（不會被馬賽克處理，也不會壓縮成點陣）"><input type="checkbox" id="bn" checked>加入引流圖片</label></div>
  <div class="grp pdfonly bnopt"><label for="bny">垂直位置</label><input id="bny" type="range" min="5" max="95" value="50"><span id="bnyv" class="tag">50%</span></div>
  <div class="grp pdfonly bnopt"><label for="bnw">圖片寬度</label><input id="bnw" type="range" min="30" max="100" value="90"><span id="bnwv" class="tag">90%</span></div>
  <div class="grp pdfonly bnopt"><label for="bnp">圖片頁數</label><input id="bnp" type="text" placeholder="留空＝全部頁面" title="例如 1-3,5；留空＝每一頁都加"></div>
  <div class="grp"><button id="undo" disabled>復原</button><button id="clear" disabled>清除全部</button></div>
  <div class="grp"><button id="edit">編輯範本</button><button id="save" class="pri" hidden>儲存範本</button><button id="cancel" hidden>取消編輯</button><label class="chk" title="依檔名判斷盤前／盤後，載入後直接套用範本並匯出"><input type="checkbox" id="auto">載入後自動匯出</label></div>
  <div class="grp"><button id="prev" class="pdfonly" disabled>上一頁</button><span id="pn">—</span><button id="next" class="pdfonly" disabled>下一頁</button></div>
  <span class="sp"></span>
  <button id="exp" class="pri" disabled>匯出 PDF</button>
  <button id="again" class="pri" hidden>儲存已處理的檔案</button>
  <a id="dlink" class="btn" style="text-decoration:none;color:var(--ink)" hidden>點此下載</a>
</div>
<div id="stage">
  <div id="empty"><b>拖曳 PDF 到這裡</b>或按上方「選擇 PDF」。檔案只在你的瀏覽器內處理，不會上傳。</div>
  <canvas id="cv" aria-label="預覽，拖曳框選要遮蔽的區域"></canvas>
</div>
<div class="foot" id="msg">載入 PDF 後，在頁面上拖曳框選區域。先在「套用頁數」填入頁碼（例如 1-3,5 或「全部」；留空＝只有目前這頁）再框選。設定好後按「儲存範本」，範本會鎖定；下次直接丟檔案，會依檔名（行動快訊＝盤前、盤後快訊＝盤後）自動套用對應範本。</div>

/* 引流圖片的位置（以頁面比例表示）：回傳 {x,y,w,h}，y 為由上往下 */
function bnBox(W,H){
  const w=Math.min(W*bnW(),W),h=w*BANNER_RATIO,x=(W-w)/2;
  let y=H*bnY()-h/2;y=Math.max(0,Math.min(y,H-h));

}
const mode=()=>document.querySelector('input[name=mode]:checked').value;
const say=(t,err)=>{$('msg').textContent=t;$('msg').className='foot'+(err?' err':'')};

async function renderPage(n,scale){
  const p=await pdf.getPage(n),vp=p.getViewport({scale}),c=document.createElement('canvas');
  c.width=Math.floor(vp.width);c.height=Math.floor(vp.height);
  await p.render({canvasContext:c.getContext('2d'),viewport:vp}).promise;return c;
}
async function open(file,note){
  try{
    say('讀取中…');
    const buf=await file.arrayBuffer();srcBuf=buf.slice(0);pdf=await pdfjsLib.getDocument({data:buf}).promise;
    N=pdf.numPages;pg=1;fname=file.name.replace(/\.pdf$/i,'');
    $('empty').style.display='none';cv.style.display='block';
    await show();say((note||'')+(editing?'在頁面上拖曳框選要遮蔽的區域。完成後按「儲存範本」或「匯出 PDF」。':'已套用「'+SN[sess]+'」範本，確認後按「匯出 PDF」。'));return true;
  }catch(e){say('無法開啟這個檔案，請確認它是未加密的 PDF。',true);return false}
}
async function show(){
  const t=++tok,p=await pdf.getPage(pg),w1=p.getViewport({scale:1}).width;
  const dpr=Math.min(window.devicePixelRatio||1,2),avail=Math.min($('stage').clientWidth-32,900);
  const b=await renderPage(pg,avail/w1*dpr);
  if(t!==tok)return;
  base=b;cv.width=b.width;cv.height=b.height;cv.style.width=(b.width/dpr)+'px';cv.dataset.dpr=dpr;
  draw();ui();
}
function apply(c,W,H,r){
  const x=Math.round(r.x*W),y=Math.round(r.y*H),w=Math.min(Math.round(r.w*W),W-x),h=Math.min(Math.round(r.h*H),H-y);
  if(w<1||h<1)return;
  if(mode()==='black'){c.fillStyle='#000';c.fillRect(x,y,w,h);return}
  const b=Math.max(2,Math.round($('size').value*W/900)),d=c.getImageData(x,y,w,h),a=d.data;
  for(let by=0;by<h;by+=b)for(let bx=0;bx<w;bx+=b){
    const ye=Math.min(by+b,h),xe=Math.min(bx+b,w);let R=0,G=0,B=0,n=0;
    for(let j=by;j<ye;j++)for(let i=bx;i<xe;i++){const k=(j*w+i)*4;R+=a[k];G+=a[k+1];B+=a[k+2];n++}
    R=R/n;G=G/n;B=B/n;
    for(let j=by;j<ye;j++)for(let i=bx;i<xe;i++){const k=(j*w+i)*4;a[k]=R;a[k+1]=G;a[k+2]=B}
  }
  c.putImageData(d,x,y);
}

  if(!base)return;
  ctx.drawImage(base,0,0);
  rects.filter(r=>tab!=='pdf'||hit(r,pg)).forEach(r=>apply(ctx,cv.width,cv.height,r));
  if(tab==='pdf'&&bnOn()&&BN.complete&&BN.naturalWidth&&hit({pages:bnP()},pg)){const b=bnBox(cv.width,cv.height);ctx.drawImage(BN,b.x,b.y,b.w,b.h)}
  if(drag){
    const dpr=+cv.dataset.dpr||1,x=Math.min(drag.x0,drag.x1)*cv.width,y=Math.min(drag.y0,drag.y1)*cv.height,
      w=Math.abs(drag.x1-drag.x0)*cv.width,h=Math.abs(drag.y1-drag.y0)*cv.height;
    ctx.save();ctx.strokeStyle='#1d4ed8';ctx.lineWidth=2*dpr;ctx.setLineDash([6*dpr,4*dpr]);ctx.strokeRect(x,y,w,h);ctx.restore();
  }
}
function ui(){
  const n=rects.length;
  const im=imgs[tab];
  $('pn').textContent=tab==='pdf'?(pdf?`第 ${pg} / ${N} 頁`:'—'):(im?im.im.naturalWidth+'×'+im.im.naturalHeight+' px':'—');
  $('prev').disabled=tab!=='pdf'||!pdf||pg<=1||busy;$('next').disabled=tab!=='pdf'||!pdf||pg>=N||busy;
  $('undo').disabled=!n||busy||!editing;$('clear').disabled=!n||busy||!editing;$('exp').disabled=!hasDoc()||busy;
  $('edit').hidden=editing;$('save').hidden=!editing;$('cancel').hidden=!editing;$('edit').disabled=busy;
  document.querySelectorAll('.pdfonly').forEach(e=>e.classList.toggle('hide',tab!=='pdf'));document.querySelectorAll('.imgonly').forEach(e=>e.classList.toggle('hide',tab==='pdf'));$('exp').textContent=tab==='pdf'?'匯出 PDF':'匯出圖片';$('picktxt').textContent=PICK[tab];$('file').accept=tab==='pdf'?'application/pdf':'image/jpeg,image/png';
  $('pages').disabled=!editing;cv.style.cursor=editing?'crosshair':'default';
  const si=$('sinfo');si.className='tag'+(editing?' edit':'');si.textContent='【'+SN[sess]+'】'+(editing?'編輯中':'已鎖定')+'・'+n+' 個遮蔽區'+(editing&&dirty()?'（未儲存）':'');
}
const pt=e=>{const r=cv.getBoundingClientRect();return{x:Math.min(1,Math.max(0,(e.clientX-r.left)/r.width)),y:Math.min(1,Math.max(0,(e.clientY-r.top)/r.height))}};
cv.addEventListener('pointerdown',e=>{if(!hasDoc()||busy||!editing)return;cv.setPointerCapture(e.pointerId);const p=pt(e);drag={x0:p.x,y0:p.y,x1:p.x,y1:p.y}});
cv.addEventListener('pointermove',e=>{if(!drag)return;const p=pt(e);drag.x1=p.x;drag.y1=p.y;draw()});
cv.addEventListener('pointerup',()=>{
  if(!drag)return;
  const r={x:Math.min(drag.x0,drag.x1),y:Math.min(drag.y0,drag.y1),w:Math.abs(drag.x1-drag.x0),h:Math.abs(drag.y1-drag.y0)};
  drag=null;if(r.w>.005&&r.h>.005){if(tab==='pdf')r.pages=$('pages').value.trim()||String(pg);rects.push(r)}
  draw();ui();
});
const undo=()=>{if(rects.length){rects.pop();draw();ui()}};
$('undo').onclick=undo;
$('clear').onclick=()=>{rects=[];draw();ui();say('已清空編輯中的遮蔽區。按「儲存範本」才會覆蓋已儲存的範本。')};
$('prev').onclick=()=>{pg--;show()};$('next').onclick=()=>{pg++;show()};
$('size').oninput=draw;
const bnSync=()=>{$('bnyv').textContent=$('bny').value+'%';$('bnwv').textContent=$('bnw').value+'%';document.querySelectorAll('.bnopt').forEach(e=>e.style.opacity=bnOn()?1:.45);draw()};
['bn','bny','bnw','bnp'].forEach(id=>$(id).addEventListener('input',bnSync));
document.querySelectorAll('input[name=mode]').forEach(i=>i.onchange=draw);
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key==='z'){e.preventDefault();undo()}});
$('file').onchange=e=>{handle(e.target.files);e.target.value=''};
$('pick').onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();$('file').click()}};
const st=$('stage');
st.ondragover=e=>{e.preventDefault();st.classList.add('over')};
st.ondragleave=()=>st.classList.remove('over');
st.ondrop=e=>{e.preventDefault();st.classList.remove('over');handle(e.dataTransfer.files)};
window.addEventListener('resize',()=>{if(hasDoc()&&!busy)redraw()});

async function doExport(){
  if(!pdf||busy)return;
  busy=true;ui();$('again').hidden=true;$('dlink').hidden=true;ready=null;
  try{
    const {PDFDocument}=PDFLib;
    const LAD=[{s:2,q:.85},{s:1.75,q:.75},{s:1.5,q:.65},{s:1.5,q:.5},{s:1.25,q:.5},{s:1.25,q:.4},{s:1,q:.35},{s:.8,q:.3}];
    let li={1:4,2:2,3:0}[$('q').value];
    const limV=+$('lim').value,minMode=limV<0,lim=limV>0?limV*1024:0,allr=$('all').checked;
    if(minMode)li=LAD.length-1;const li0=li;
    const src=await PDFDocument.load(srcBuf,{ignoreEncryption:true,updateMetadata:false});
    const keep=[];
    for(let i=1;i<=N;i++)if(!allr&&!rects.some(r=>hit(r,i)))keep.push(i);
    let baseB=0;
    if(keep.length){const t=await PDFDocument.create();for(const pp of await t.copyPages(src,keep.map(i=>i-1)))t.addPage(pp);baseB=(await t.save({useObjectStreams:true})).length}
    const hopeless=lim&&baseB>=lim;
    let bytes;
    for(;;){
      const Q=LAD[li],out=await PDFDocument.create();
      const kept=keep.length?await out.copyPages(src,keep.map(i=>i-1)):[];
      const kmap={};keep.forEach((i,k)=>kmap[i]=kept[k]);
      for(let i=1;i<=N;i++){
        if(kmap[i]){out.addPage(kmap[i]);continue}
        say(`處理中：第 ${i} / ${N} 頁`+(li>li0?'（為符合大小上限，降低畫質重試中）':'…'));
        const p=await pdf.getPage(i),v=p.getViewport({scale:1}),c=await renderPage(i,Q.s);
        const cx=c.getContext('2d');rects.filter(r=>hit(r,i)).forEach(r=>apply(cx,c.width,c.height,r));
        const jb=await new Promise(res=>c.toBlob(res,'image/jpeg',Q.q));
        const img=await out.embedJpg(await jb.arrayBuffer());
        const pgx=out.addPage([v.width,v.height]);pgx.drawImage(img,{x:0,y:0,width:v.width,height:v.height});
        c.width=c.height=0;
      }
      if(bnOn()){
        const bi=await out.embedJpg(await (await fetch(BANNER_SRC)).arrayBuffer());
        out.getPages().forEach((pgx,idx)=>{
          if(!hit({pages:bnP()},idx+1))return;
          const sz=pgx.getSize(),b=bnBox(sz.width,sz.height);
          pgx.drawImage(bi,{x:b.x,y:sz.height-b.y-b.h,width:b.w,height:b.h});
        });
      }
      bytes=await out.save({useObjectStreams:true});
      if(!lim||bytes.length<=lim||li>=LAD.length-1||keep.length===N||hopeless)break;
      li++;
    }
    const over=lim&&bytes.length>lim;
    const doc={output:()=>new Blob([bytes],{type:'application/pdf'})};
    ready={name:fname+'-masked.pdf',blob:doc.output('blob')};
    say('【'+SN[sess]+'】處理完成（原檔 '+Math.round(srcBuf.byteLength/1024)+' KB → 共 '+Math.round(bytes.length/1024)+' KB'+(keep.length?'，其中未遮蔽的頁面約 '+Math.round(baseB/1024)+' KB':'')+'）'+(over?(hopeless?'。未遮蔽的頁面原本就超過上限，所以遮蔽頁保持較清晰的畫質；要更小需先壓縮原檔':'。已降到最低畫質仍超過上限'):'')+'，正在儲存…',over);
    try{const r=await deliver(ready.name,ready.blob);say(FB);$('again').hidden=false}
    catch(e){$('again').hidden=false;say((e&&e.code==='declined'?'已取消儲存。':'自動儲存失敗（'+((e&&(e.code||e.message))||e)+'）。')+'請按上方「儲存已處理的 PDF」。',!(e&&e.code==='declined'))}
  }catch(e){console.error(e);say(e&&e.code==='declined'?'已取消儲存。':'匯出失敗：'+((e&&(e.code||e.message))||e),!(e&&e.code==='declined'))}
  busy=false;ui();
}
let ready=null;
async function deliver(name,blob){
  const u=URL.createObjectURL(blob),a=document.createElement('a');
  a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();
  const L=$('dlink');L.href=u;L.download=name;L.hidden=false;
  return 'fb';
}
const FB='已開始用瀏覽器下載。如果沒有出現檔案，請按上方「點此下載」，並檢查瀏覽器是否阻擋了下載。';
$('again').onclick=async()=>{
  if(!ready)return;
  try{const r=await deliver(ready.name,ready.blob);say(r==='fb'?FB:'已匯出。');$('again').hidden=r==='ok'}
  catch(e){say(e&&e.code==='declined'?'已取消儲存。':'儲存失敗：'+((e&&(e.code||e.message))||e),!(e&&e.code==='declined'))}
};
$('exp').onclick=()=>exportNow();

function hit(r,n){
  const s=(r.pages||'').replace(/\s/g,'');
  if(!s||/^(all|全部)$/i.test(s))return true;
  return s.split(/[,，、]/).some(t=>{const m=t.match(/^(\d+)(?:[-~–](\d+))?$/);return m&&n>=+m[1]&&n<=+(m[2]||m[1])});
}
const SN={pre:'盤前',post:'盤後',tw:'台股快訊',img:'自訂圖片'},K_R=k=>'pdfmosaic:v2:rects:'+k,K_C='pdfmosaic:v2:cfg';
let sets={pre:[],post:[],tw:[],img:[]};
const clone=a=>JSON.parse(JSON.stringify(a));
const dirty=()=>JSON.stringify(rects)!==JSON.stringify(sets[sess]);
const detect=n=>/盤後/.test(n)?'post':(/行動快訊|盤前/.test(n)?'pre':null);
const radio=k=>document.querySelector('input[name=sess][value="'+k+'"]')||{};
function switchSess(k){
  if(k===sess)return true;
  if(editing&&dirty()&&!confirm('「'+SN[sess]+'」範本有尚未儲存的修改，切換後會捨棄。要繼續嗎？')){radio(sess).checked=true;return false}
  sess=k;if(k==='pre'||k==='post')lastPdf=k;rects=clone(sets[k]);editing=!rects.length;radio(k).checked=true;draw();ui();
  say('已切換到「'+SN[k]+'」範本（'+rects.length+' 個遮蔽區'+(editing?'，尚未設定，請框選遮蔽區後儲存':'，已鎖定')+'）。');
  return true;
}
document.querySelectorAll('input[name=sess]').forEach(i=>i.onchange=e=>{switchSess(e.target.value)});
const kindOf=f=>/pdf$/i.test(f.type||f.name)?'pdf':(/^image\/(jpeg|png)$/.test(f.type)||/\.(jpe?g|png)$/i.test(f.name))?(tab==='tw'||/台股快訊/.test(f.name)?'tw':'img'):null;
const exportNow=()=>tab==='pdf'?doExport():doExportImg();
async function handle(files){
  files=[...files].map(f=>({f,k:kindOf(f)})).filter(x=>x.k);
  if(!files.length){say('請放入 PDF、JPG 或 PNG 檔案。',true);return}
  const auto=$('auto').checked;
  for(const {f,k} of (auto?files:[files[0]])){
    if(!setTab(k))break;
    let note='';
    if(k==='pdf'){
      const d=detect(f.name);
      if(d){if(!switchSess(d))break;note='依檔名判斷為「'+SN[d]+'」。'}
      else if(auto){say('無法從檔名判斷盤前／盤後，已略過：'+f.name+'（檔名需含「行動快訊」或「盤後快訊」）',true);continue}
      else note='檔名無法判斷，沿用目前選擇的「'+SN[sess]+'」。';
    }else if(k==='tw'&&/台股快訊/.test(f.name))note='依檔名判斷為「台股快訊」。';
    if(auto&&!rects.length){say('「'+SN[sess]+'」範本還沒有遮蔽區，已略過：'+f.name,true);continue}
    if(!await(k==='pdf'?open(f,note):openImg(f,note)))break;
    if(auto)await exportNow();
  }
}
function saveTpl(){
  try{localStorage.setItem(K_R(sess),JSON.stringify(rects))}catch(e){say('此環境無法儲存範本。',true);return}
  sets[sess]=clone(rects);editing=!rects.length;draw();ui();
  say('已儲存「'+SN[sess]+'」範本（'+rects.length+' 個遮蔽區）'+(editing?'。':'並鎖定。'));
}
function saveCfg(){
  try{localStorage.setItem(K_C,JSON.stringify({mode:mode(),size:$('size').value,q:$('q').value,all:$('all').checked,lim:$('lim').value,auto:$('auto').checked,ofmt:$('ofmt').value,bn:$('bn').checked,bny:$('bny').value,bnw:$('bnw').value,bnp:$('bnp').value}))}catch(e){}
}
['size','q','all','lim','auto','ofmt','bn','bny','bnw','bnp'].forEach(id=>$(id).addEventListener('change',saveCfg));
document.querySelectorAll('input[name=mode]').forEach(i=>i.addEventListener('change',saveCfg));
function loadTpl(){
  try{
    const c=JSON.parse(localStorage.getItem(K_C));
    if(c){
      if(c.size)$('size').value=c.size;if(c.q)$('q').value=c.q;if(c.ofmt)$('ofmt').value=c.ofmt;$('all').checked=!!c.all;$('auto').checked=!!c.auto;if(c.bn!=null)$('bn').checked=!!c.bn;if(c.bny)$('bny').value=c.bny;if(c.bnw)$('bnw').value=c.bnw;if(c.bnp!=null)$('bnp').value=c.bnp;
      if(c.lim!=null){$('lim').value=c.lim;if($('lim').value!==String(c.lim))$('lim').value='800'}
      const m=document.querySelector('input[name=mode][value="'+c.mode+'"]');if(m)m.checked=true;
    }
  }catch(e){}
  for(const k of ['pre','post','tw','img']){try{const a=JSON.parse(localStorage.getItem(K_R(k)));if(Array.isArray(a))sets[k]=a}catch(e){}}
  rects=clone(sets[sess]);editing=!rects.length;ui();
  say('遮蔽區：盤前 '+sets.pre.length+'、盤後 '+sets.post.length+'、台股快訊 '+sets.tw.length+'、自訂圖片 '+sets.img.length+' 個。丟入 PDF 會依檔名自動選盤前／盤後；檔名含「台股快訊」的 JPG／PNG 會進台股快訊範本。');
}
$('save').onclick=saveTpl;
$('edit').onclick=()=>{editing=true;ui();say('「'+SN[sess]+'」範本編輯中。改完請按「儲存範本」。')};
$('cancel').onclick=()=>{rects=clone(sets[sess]);editing=!rects.length;draw();ui();say('已取消編輯，還原為已儲存的「'+SN[sess]+'」範本。')};
/* ===== 圖片工作區（台股快訊 JPG／自訂圖片） ===== */
const PICK={pdf:'選擇 PDF',tw:'選擇 JPG',img:'選擇圖片'};
const EMPTY={
  pdf:'<b>拖曳 PDF 到這裡</b>或按上方「選擇 PDF」。檔案只在你的瀏覽器內處理，不會上傳。',
  tw:'<b>拖曳台股快訊 JPG 到這裡</b>第一次先框選要遮蔽的區域並按「儲存範本」，之後每天直接丟圖片即可。檔案只在你的瀏覽器內處理。',
  img:'<b>拖曳 JPG / PNG 到這裡</b>或按上方「選擇圖片」，再框選要遮蔽的區域。遮蔽區可按「儲存範本」記住。'
};
function hasDoc(){return tab==='pdf'?!!pdf:!!imgs[tab]}
const redraw=()=>tab==='pdf'?show():showImg();
function refresh(){
  $('empty').innerHTML=EMPTY[tab];
  if(tab==='pdf'){
    if(pdf){$('empty').style.display='none';cv.style.display='block';show()}
    else{base=null;cv.style.display='none';$('empty').style.display='';ui()}
  }else showImg();
}
function showImg(){
  const o=imgs[tab];
  if(!o){base=null;cv.style.display='none';$('empty').style.display='';ui();return}
  const W0=o.im.naturalWidth,H0=o.im.naturalHeight,sc=Math.min(1,2400/W0),c=document.createElement('canvas');
  c.width=Math.max(1,Math.round(W0*sc));c.height=Math.max(1,Math.round(H0*sc));
  c.getContext('2d').drawImage(o.im,0,0,c.width,c.height);
  const cssW=Math.min(Math.max($('stage').clientWidth-32,200),900,c.width);
  base=c;cv.width=c.width;cv.height=c.height;cv.style.width=cssW+'px';cv.dataset.dpr=Math.max(1,c.width/cssW);
  $('empty').style.display='none';cv.style.display='block';
  draw();ui();
}
const tabRadio=k=>document.querySelector('input[name=tab][value="'+k+'"]');
function setTab(t){
  if(t===tab)return true;
  const old=tab;tab=t;
  if(!switchSess(t==='pdf'?lastPdf:t)){tab=old;tabRadio(old).checked=true;return false}
  tabRadio(t).checked=true;refresh();return true;
}
document.querySelectorAll('input[name=tab]').forEach(i=>i.onchange=e=>{setTab(e.target.value)});
function loadImg(file){return new Promise((res,rej)=>{const u=URL.createObjectURL(file),im=new Image();im.onload=()=>res(im);im.onerror=()=>{URL.revokeObjectURL(u);rej(new Error('img'))};im.src=u})}
async function openImg(file,note){
  try{
    say('讀取中…');
    const im=await loadImg(file);
    imgs[tab]={im,name:file.name.replace(/\.(jpe?g|png)$/i,''),png:/png/i.test(file.type)||/\.png$/i.test(file.name),size:file.size};
    showImg();
    say((note||'')+(editing?'在圖片上拖曳框選要遮蔽的區域。完成後按「儲存範本」或「匯出圖片」。':'已套用「'+SN[sess]+'」範本，確認後按「匯出圖片」。'));return true;
  }catch(e){say('無法開啟這張圖片，請確認它是 JPG 或 PNG。',true);return false}
}
async function doExportImg(){
  const o=imgs[tab];if(!o||busy)return;
  busy=true;ui();$('again').hidden=true;$('dlink').hidden=true;ready=null;
  try{
    const W=o.im.naturalWidth,H=o.im.naturalHeight,f=$('ofmt').value,png=f==='png'||(f==='same'&&o.png);
    say('處理中…');
    const c=document.createElement('canvas');c.width=W;c.height=H;
    const cx=c.getContext('2d');
    if(!png){cx.fillStyle='#fff';cx.fillRect(0,0,W,H)}
    cx.drawImage(o.im,0,0);
    rects.forEach(r=>apply(cx,W,H,r));
    const limV=+$('lim').value,lim=limV>0?limV*1024:0,Q=[.92,.85,.75,.65,.5,.4,.3],mime=png?'image/png':'image/jpeg';
    let qi=limV<0?4:0,blob;
    for(;;){
      blob=await new Promise(res=>c.toBlob(res,mime,Q[qi]));
      if(!blob)throw new Error('圖片太大，瀏覽器無法輸出');
      if(png||!lim||blob.size<=lim||qi>=Q.length-1)break;
      qi++;
    }
    const over=!png&&lim&&blob.size>lim;
    ready={name:o.name+'-masked.'+(png?'png':'jpg'),blob};
    say('【'+SN[sess]+'】處理完成（原檔 '+Math.round(o.size/1024)+' KB → '+Math.round(blob.size/1024)+' KB'+(png&&lim?'，PNG 為無損格式，不受大小上限影響':'')+'）'+(over?'。已降到最低畫質仍超過上限':'')+'，正在儲存…',over);
    try{await deliver(ready.name,ready.blob);say(FB);$('again').hidden=false}
    catch(e){$('again').hidden=false;say('自動儲存失敗（'+((e&&(e.code||e.message))||e)+'）。請按上方「儲存已處理的檔案」。',true)}
  }catch(e){console.error(e);say('匯出失敗：'+((e&&(e.code||e.message))||e),true)}
  busy=false;ui();
}

refresh();loadTpl();bnSync();
</script>
